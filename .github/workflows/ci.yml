name: CI
on:
    pull_request:
        types: [opened, reopened, synchronize]
jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 15
            - name: Install dependencies
              run: npm install
            - name: Linter (ESLint)
              run: npm run lint
            - name: Test (Jest)
              run: CI=true npm run test
            - name: Build
              run: npm run build
            